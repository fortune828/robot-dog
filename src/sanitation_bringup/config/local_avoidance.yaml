local_costmap_builder_node:
  ros__parameters:
    cloud_topic: "/depth_anything/points_filtered"
    grid_topic: "/local_occupancy_grid"
    debug_image_topic: "/local_costmap_debug_image"
    markers_topic: "/local_obstacle_markers"
    frame_id: "base_link"
    x_min: 0.0
    x_max: 12.0
    y_min: -5.0
    y_max: 5.0
    resolution: 0.1
    min_obstacle_height: 0.08
    max_obstacle_height: 1.5
    min_points_per_cell: 1
    robot_radius: 0.35
    safety_margin: 0.35
    inflation_radius: 0.7
    log_interval: 0

local_astar_planner_node:
  ros__parameters:
    grid_topic: "/local_occupancy_grid"
    path_topic: "/local_path"
    goal_marker_topic: "/local_goal_marker"
    status_topic: "/planning_status"
    start_x: 0.0
    start_y: 0.0
    goal_x: 5.0
    goal_y: 0.0
    allow_diagonal: true
    obstacle_threshold: 80
    unknown_as_obstacle: false
    path_smoothing: true
    early_avoidance_enabled: true
    early_avoidance_distance: 3.5
    early_avoidance_width: 1.0
    preferred_clearance: 1.0
    heuristic_weight: 2.0
    obstacle_cost_weight: 3.5
    smoothness_weight: 0.4
    path_change_weight: 1.0
    goal_direction_weight: 0.2
    hold_last_path_enabled: true
    hold_publish_rate: 10.0
