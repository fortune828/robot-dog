# ============================================================================
#  uavpatrol — 全局默认参数
#  修改此文件即可切换 Mock/Real 模式、调整检测阈值等，无需改代码
# ============================================================================

# ---- 模拟摄像头 ----
mock_camera_node:
  ros__parameters:
    video_path: ""                         # 空则自动查找 data/videos/test_video.mp4
    frame_width: 640
    frame_height: 480
    publish_rate: 15.0                     # Hz
    topic: "/camera/image_raw"
    camera_info_topic: "/camera/camera_info"
    frame_id: "camera_optical_frame"
    focal_length_px: 480.0                  # Mock 近似值；真实相机必须使用标定内参
    principal_point_x: -1.0                 # <0 时使用图像中心
    principal_point_y: -1.0

# ---- 目标检测 ----
detection_node:
  ros__parameters:
    input_topic: "/camera/image_raw"
    annotated_topic: "/detection/annotated_image"
    results_topic: "/detection/results"
    detection_prob: 0.4                    # 每帧产生检测的概率（Mock 模式）
    max_detections: 3                      # 单帧最大检测数

# ---- 模拟底盘 ----
mock_chassis_node:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"
    odom_frame: "odom"
    base_frame: "base_link"
    update_rate: 20.0                      # Hz
    gps_origin_lat: 30.747903                # odom(0,0) 对应 GPS 纬度
    gps_origin_lon: 103.925269               # odom(0,0) 对应 GPS 经度

# ---- 模拟 RTK GPS ----
mock_gps_node:
  ros__parameters:
    topic: "/fix"
    publish_rate: 5.0
    speed: 10.0
    frame_id: "gps_link"
    world_frame: "world"
    plan_topic: "/global_plan"
    odom_topic: "/odom"
    origin_lat: 30.747903
    origin_lon: 103.925269
    noise_stddev: 0.000001                    # 静止时 GPS 噪声标准差 (°)

# ---- OSM 地图引擎 ----
osm_map_manager:
  ros__parameters:
    map_file: ""                                 # 空则自动查找 data/map.osm
    origin_lat: 30.747903
    origin_lon: 103.925269
    origin_from_first_fix: false
    world_frame: "world"
    topology_marker_topic: "/osm_topology_markers"
    plan_service_name: "/plan_osm_path"
    goal_pose_topic: "/goal_pose"
    global_plan_topic: "/global_plan"
    gps_topic: "/fix"

# ---- 全覆盖路径规划 (CPP) ----
polygon_coverage_planner:
  ros__parameters:
    clicked_point_topic: "/clicked_point"
    plan_topic: "/global_plan"
    world_frame: "world"
    sweep_spacing: 1.5                       # 扫掠线间距 (m)
    closing_threshold: 1.0                  # 多边形闭合判定距离 (m)
    gps_topic: "/fix"
    mission_status_topic: "/mission_status"
    osm_plan_service: "/plan_osm_path"
    goal_pose_topic: "/goal_pose"

# ---- 无人机 GPS 航点导出 ----
uav_waypoint_exporter_node:
  ros__parameters:
    gps_topic: "/fix"
    plan_topic: "/global_plan"
    waypoint_json_topic: "/uav/gps_waypoints_json"
    origin_mode: "first_fix"                  # "first_fix" 使用启动后第一帧 RTK
    origin_lat: 30.747903                     # origin_mode=param 时使用
    origin_lon: 103.925269
    altitude_m: 30.0                          # 默认相对起飞点高度，实测前按场地修改
    altitude_mode: "relative_to_takeoff"      # 或 "absolute_amsl" 海拔高度
    speed_mps: 5.0
    min_spacing_m: 2.0                        # 航点抽稀距离
    min_waypoints: 2
    max_waypoints: 65535                      # DJI Waypoint 3.0 单航线任务上限
    output_dir: ""                             # 空则自动使用工程内 data/output
    output_prefix: "uav_waypoints"
    mission_name: "uav_area_mission"
    coordinate_frame: "WGS84"
    protocol: "DJI_WAYPOINT_3_0"
    aircraft_model: "DJI Matrice 4E"

# ---- 地面过滤 ----
ground_filter_node:
  ros__parameters:
    input_topic: "/depth_anything_v3/output/point_cloud"
    input_convention: "optical"
    output_topic: "/depth_anything/points_filtered"
    filter_mode: "bev_adaptive"               # "pass_through" 或 "bev_adaptive"
    min_z: 0.08                               # pass_through模式: 障碍物最低高度 (m)
    max_z: 1.50                               # pass_through模式: 障碍物最高高度 (m)
    bev_resolution: 0.15                      # BEV网格分辨率 (m), 增大减少噪声
    bev_height_diff: 0.12                     # BEV高度差阈值: 高出地面此值 → 障碍物, 增大过滤地面噪点
    output_frame: "camera_link"
    blind_spot: 2.0                           # 前方盲区距离 (m), 消除近处地面噪声
    camera_height: 1.0                        # 相机物理安装高度 (m)
    camera_pitch_deg: 0.0                     # 相机俯仰角 (度)
    log_interval: 30
    camera_x: 0.15
    camera_y: 0.0
    camera_z: 1.0                             # ← 相机离地1m
    camera_roll: 0.0
    camera_pitch: 0.0
    camera_yaw: 0.0

# ---- 路点巡检 ----
waypoint_patrol_node:
  ros__parameters:
    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"
    control_rate: 10.0                     # Hz
    arrival_radius: 0.15                   # 路点到达判定半径 (m)
    lookahead: 0.5                         # 纯追踪前视距离 (m)
    max_linear: 0.4                        # 最大线速度 (m/s)
    max_angular: 0.8                       # 最大角速度 (rad/s)
    waypoints: [1.0, 0.0, 1.0, 1.0, 0.0, 1.0, 0.0, 0.0]
